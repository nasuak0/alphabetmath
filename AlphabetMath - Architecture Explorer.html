<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AlphabetMath — Architecture &amp; Flows</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#4f46e5;--accsoft:#eef2ff}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
a{color:var(--acc);text-decoration:none}a:hover{color:#3730a3;text-decoration:underline}
#canvas{position:relative;min-width:0}
#cols{padding:11px 0 0 11px}/* room for the step badges, which overhang each node by 8px */
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.col{width:198px;flex:0 0 198px}
.colhead{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.node{position:relative;display:block;text-align:left;width:100%;padding:9px 10px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;transition:opacity .18s,border-color .18s,box-shadow .18s;cursor:pointer}
.node:hover{border-color:#94a3b8;box-shadow:0 2px 10px rgba(15,23,42,.07)}
.node .nt{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.node .ns{display:block;font-size:10px;color:var(--mut);line-height:1.35;margin-top:3px}
.node .nd{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%}
.node.dim{opacity:.16}
.node.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--accsoft)}
.node.sel{border-color:#0f172a;box-shadow:0 0 0 3px #e2e8f0}
.node.flash{animation:fl .7s ease}
@keyframes fl{0%,100%{box-shadow:0 0 0 3px var(--accsoft)}50%{box-shadow:0 0 0 9px var(--accsoft)}}
.nbadge{position:absolute;top:-8px;left:-8px;width:19px;height:19px;border-radius:50%;background:var(--acc);color:#fff;font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(79,70,229,.4);z-index:5}
.node.on .nbadge[data-n]{display:flex}
.wire{fill:none;stroke:#cbd5e1;stroke-width:1.15;transition:opacity .2s}
.wire.mute{opacity:.1}
.wire.lit{stroke:#94a3b8;stroke-width:1.6;opacity:1}
.fwire{fill:none;stroke:var(--acc);stroke-width:2}
.flowcard{display:block;width:100%;text-align:left;padding:11px 13px;border:0;border-radius:12px;background:#ececee;cursor:pointer;overflow:hidden;transition:background .15s,box-shadow .15s,max-height .3s ease,opacity .2s ease,padding .3s ease,margin .3s ease}
#flowList .flowcard+.flowcard{margin-top:8px}
#flowList.picked .flowcard:not(.on){max-height:0;opacity:0;padding-top:0;padding-bottom:0;margin-top:0;pointer-events:none}
@keyframes stepsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#steps.slidein{animation:stepsIn .28s ease}
.flowcard:hover{background:#e5e4e7}
.flowcard.on{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.13),0 0 0 .5px rgba(15,23,42,.05)}
.flowcard .ft{font-size:12.5px;font-weight:650;line-height:1.3}
.flowcard.on .ft{color:var(--acc)}
.flowcard .fs{font-size:11px;color:var(--mut);line-height:1.4;margin-top:3px}
.step{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s,box-shadow .15s}
.step:hover{background:#ececee}
.step.on{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.13),0 0 0 .5px rgba(15,23,42,.05)}
.step .sn{width:19px;height:19px;border-radius:50%;background:#e2e1e4;color:#475569;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step.on .sn{background:var(--acc);color:#fff}
.rowhead{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.card{border:1px solid var(--line);border-radius:12px;background:#fff}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:550;background:#fff;transition:.15s;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:#94a3b8}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{padding:4px 11px;font-size:11px;font-weight:600;color:var(--mut);background:#fff;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--acc);color:#fff}
body.shell{height:100vh;overflow:hidden}
#grid{display:block;height:100%;min-height:0}
#main{height:100%;overflow:hidden;display:flex;flex-direction:column}
#canvas{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#fitbox{flex:1 1 auto;min-height:0}
@media (max-width:879px){#side{width:min(330px,calc(100vw - 24px));right:12px;max-height:62vh}}
#fitbox{position:relative;overflow:auto}
body.fitview #fitbox{overflow:hidden}
#scaler{position:relative;width:max-content;transform-origin:0 0}
/* Floating panel — same vocabulary as the app's Tweaks panel: it hovers over the diagram, never steals width. */
#side{position:fixed;right:18px;top:var(--paneTop,118px);width:330px;max-height:calc(100vh - var(--paneTop,118px) - 20px);display:flex;flex-direction:column;background:rgba(249,248,250,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:18px;box-shadow:0 14px 44px rgba(15,23,42,.14),0 0 0 .5px rgba(15,23,42,.08);overflow:hidden;z-index:40;transition:opacity .18s ease,transform .18s ease}
body.panel-off #side{opacity:0;transform:translateX(10px) scale(.99);pointer-events:none}
.panelhead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 16px 11px}
.panelhead .pt{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
#btnClose{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#94a3b8;cursor:pointer;transition:.15s}
#btnClose:hover{background:rgba(15,23,42,.06);color:var(--ink)}
#sidebody{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
#side .card{border:0;background:#ececee;border-radius:12px}
#side .chip{border:0;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.13),0 0 0 .5px rgba(15,23,42,.05)}
#side .chip:hover{background:#fbfbfc}
.sechead{position:sticky;top:0;z-index:2;background:rgba(249,248,250,.92);backdrop-filter:blur(12px);width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 16px;border-bottom:1px solid rgba(15,23,42,.06);cursor:pointer}
.sechead:hover .rowhead{color:#475569}
.sechead .cv{transition:transform .18s;color:#94a3b8}
.sechead.open .cv{transform:rotate(90deg)}
</style>
</head>

</div></div>
</div>
</main>

<div id="sidebody">
<div class="sechead" data-sec="flows"><span class="flex items-center gap-2"><svg class="cv" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1.5 L7 5 L2 8.5"/></svg><span class="rowhead">Flows</span></span><button id="btnReset" class="chip !py-1 !px-2.5 !text-[11px]">Clear selection</button></div>

<div class="sechead" data-sec="obs"><span class="flex items-center gap-2"><svg class="cv" width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1.5 L7 5 L2 8.5"/></svg><span class="rowhead">Patterns &amp; risks</span></span><span id="obsCount" class="text-[11px] text-slate-400"></span></div>

</div>
</aside>
</div>

    {
      "id": "boot_nobuild",
      "label": "Boot — no-build (live product)",
      "summary": "How index.html turns raw .jsx files on disk into a running React app with no build step.",
      "path": [
        "mobile_index",
        "babel",
        "loader",
        "esmsh",
        "main",
        "app"
      ],
      "steps": [
        {
          "node": "mobile_index",
          "title": "Shell paints first",
          "detail": "styles.css is linked, the phone gate rule and the #zmath-boot placeholder render immediately so the page never flashes blank while modules download.",
          "plain": {
            "title": "The screen is never blank",
            "detail": "The look loads first and a placeholder appears, so a slow start looks like loading rather than breakage."
          }
        },
        {
          "node": "babel",
          "title": "Babel standalone loads",
          "detail": "Pinned 7.29.0 with an integrity hash. It is the only thing that can turn JSX into JS in this reader.",
          "plain": {
            "title": "The translator arrives",
            "detail": "A small translator is fetched from the internet to turn the source dialect into something the browser can run."
          }
        },
        {
          "node": "loader",
          "title": "loadGraph walks the import graph",
          "detail": "Starting at ./zmath/main.jsx it fetches the source, regex-collects every relative specifier, and recurses depth-first with a cache so each module is built once.",
          "plain": {
            "title": "The files are walked, one leading to the next",
            "detail": "Starting from one file, the loader reads it, notices which other files it mentions, fetches those, and keeps going until everything is collected. Each file is fetched only once."
          }
        },
        {
          "node": "loader",
          "title": "Transform, rewrite, blob-ify",
          "detail": "Each module is Babel-transformed, its relative imports are rewritten to the blob URLs of the already-built dependencies, and import.meta.url is pinned to the real file URL (a blob: URL is not a resolvable base).",
          "plain": {
            "title": "Each file is translated and rewired",
            "detail": "Every file is converted, and its references to its neighbours are pointed at the already-translated copies held in memory. This is the fiddly part, and the price of having no build step."
          }
        },
        {
          "node": "esmsh",
          "title": "Bare specifiers fall through",
          "detail": "'react' and 'react-dom/client' are left untouched and resolved by the import map to esm.sh — the same specifiers Vite resolves, which is what keeps one source set valid for both readers.",
          "plain": {
            "title": "The toolkit is fetched",
            "detail": "The toolkit’s names are left untouched and looked up on the internet — the same names the packaged build uses, which is why one set of files works both ways."
          }
        },
        {
          "node": "main",
          "title": "Dynamic import of the entry blob",
          "detail": "The finished blob URL is imported. main.jsx sets document.title and calls createRoot(#root).",
          "plain": {
            "title": "The app starts",
            "detail": "The finished file is handed to the browser. The app takes over the page and the placeholder disappears."
          }
        },
        {
          "node": "app",
          "title": "App mounts inside the ErrorBoundary",
          "detail": "A render failure prints the real stack in monospace instead of a blank screen; a loader failure prints its own message into #root.",
          "plain": {
            "title": "With a safety net around it",
            "detail": "If anything fails, the real error is printed on the page instead of a blank white screen."
          }
        }
      ],
      "plain": {
        "label": "Opening the app (the live version)",
        "summary": "How raw files on disk become a running app with no publishing step."
      }
    },

          "detail": "For { fig: 'name' } it looks up ZFIGURES[name] and renders the component it finds.",
          "plain": {
            "title": "Each piece is looked at in turn",
            "detail": "A paragraph is printed. A diagram name is looked up on the shared hook."
          }
        },
        {
          "node": "fig_registry",
          "title": "One registry object, one owner",
          "detail": "figures-registry.js exports a single empty object. It replaced window.ZFIGURES so the import graph — not script order — decides who populates it.",
          "plain": {
            "title": "The coat check",
            "detail": "One shared list with one clear owner. Nothing depends on files loading in a particular order — which is what the old approach got wrong."
          }
        },
        {
          "node": "figures",
          "title": "Figures self-register on import",
          "detail": "components.jsx imports figures.jsx purely for the side-effect; each diagram adds itself to ZFIGURES, and components.jsx adds its own 'parallelogram'. Arrows point one way.",
          "plain": {
            "title": "Diagrams hang themselves up",
            "detail": "Each diagram adds itself to the list when the app starts. Adding a new one needs no changes anywhere else."
          }
        }
      ],
      "plain": {
        "label": "How a lesson diagram appears",
        "summary": "How a word in an article becomes a drawing on the page — the coat-check idea."
      }
    },
    {
      "id": "tweaks",
      "label": "Tweaks → live restyling",
      "summary": "The design-time control surface, and how a toggle becomes a cascade change.",
      "path": [
        "app",
        "tweaks_panel",
        "tweaks_overrides",
        "tokens_css"
      ],
      "steps": [
        {
          "node": "app",
          "title": "Defaults live in a marked block",
          "detail": "TWEAK_DEFAULTS sits between EDITMODE-BEGIN/END comments in app.jsx so the host can rewrite it on disk — the values persist as source, not as browser storage.",
          "plain": {
            "title": "Settings live in the source",
            "detail": "Default choices sit in a marked block in the code, so they persist as source rather than in the browser."
          }
        },
        {
          "node": "tweaks_panel",
          "title": "useTweaks holds the values",
          "detail": "A single state object; setTweak accepts either a key/value pair or a patch object, and notifies the host to persist.",
          "plain": {
            "title": "The panel holds the current values",
            "detail": "Flip a control and the new value is saved back into that block."
          }
        },
        {
          "node": "app",
          "title": "An effect writes data-* on <html>",
          "detail": "data-material, data-fit, data-tilemat, data-traymat, data-ambience, data-energy, data-capsule — one effect, re-run on tweak or page change.",
          "plain": {
            "title": "A label is written onto the page",
            "detail": "Something like “material: flat.” That is all the code does."
          }
        },
        {
          "node": "tweaks_overrides",
          "title": "CSS reacts, React does not re-render",
          "detail": "tweaks-overrides.css is last in the chain and keys off those attributes, so a material switch is a pure cascade change with no component churn.",
          "plain": {
            "title": "The stylesheet reacts",
            "detail": "It is watching for those labels and restyles accordingly. Nothing is rebuilt: code decides the state, the stylesheet decides the look."
          }
        },
        {
          "node": "tokens_css",
          "title": "Tokens do the actual work",
          "detail": "Overrides mostly reassign token variables, so one attribute flip repaints every surface that reads them.",
          "plain": {
            "title": "Named values do the real work",
            "detail": "Most switches just reassign colours and sizes, so one flip repaints every surface using them."
          }
        }
      ],
      "plain": {
        "label": "Changing the look instantly",
        "summary": "How one switch repaints the whole app without rebuilding anything."
      }
    },
    {
      "id": "gates",
      "label": "Device gates — phone & orientation",
      "summary": "Two guards, both owned by the brain so the shells cannot drift apart.",
      "path": [
        "mobile_index",
        "app",
        "app_css"
      ],
      "steps": [
        {
          "node": "mobile_index",
          "title": "Phone gate is pure CSS",
          "detail": "Under 700px wide (or 500px tall) #root is hidden and a notice shows. No JS, no React — it works before a single module has loaded. Kept identical in both shells.",
          "plain": {
            "title": "Phones are turned away by styling alone",
            "detail": "Below a certain width the app is hidden and a notice shows. No code involved — it works before anything has loaded."
          }
        },
        {
          "node": "app",
          "title": "RotateGuard is portalled to <body>",
          "detail": "createPortal places the overlay outside #root deliberately, so a CSS rule can hide the app behind it.",
          "plain": {
            "title": "The rotate notice sits above everything",
            "detail": "It is placed outside the app’s normal container deliberately, so it can cover the whole page."
          }
        },
        {
          "node": "app_css",
          "title": "body:has(#rotate-guard) #root { display:none }",
          "detail": "In portrait the guard exists and the app is hidden by selector alone. Living in the brain means both readers get the same guard from one source.",
          "plain": {
            "title": "One rule hides the app behind it",
            "detail": "When the notice exists, the app is hidden. A single line of styling, no code juggling."
          }
        },
        {
          "node": "app",
          "title": "Reduced motion respected",
          "detail": "A matchMedia check adds .reduce-motion to <body> on mount, letting the whole animation layer stand down from CSS.",
          "plain": {
            "title": "Motion preferences are respected",
            "detail": "If your device asks for reduced motion, the app marks the page and the animations stand down."
          }
        }
      ],
      "plain": {
        "label": "Blocking the wrong device",
        "summary": "Two checks that stop the app on a phone, or when the tablet is held the wrong way."
      }
    }
  ],
  "observations": [
    {
      "kind": "pattern",
      "title": "Shared core, thin adapters",
      "detail": "All logic in zmath/; both shells are adapters. Duplication is structurally impossible because there is exactly one copy of the source.",
      "plain": {
        "title": "One brain, two readers",
        "detail": "All the code lives in one folder; both ways of opening the app point at it. Duplication is impossible because there is only one copy."
      }
    },
    {
      "kind": "pattern",
      "title": "Routing by state, not by URL",
      "detail": "A screens map indexed by a page string. URL params exist only as optional deep-link overrides (?page=, ?fit=) used by comparison harnesses.",
      "plain": {
        "title": "Screens change like channels",
        "detail": "The app remembers a word and shows the matching screen. No web addresses, no back-button expectations."
      }
    },
    {
      "kind": "pattern",
      "title": "Attribute-driven theming",
      "detail": "React writes data-* attributes on <html>; CSS owns every visual consequence. Material changes cost no re-render.",
      "plain": {
        "title": "Flip a switch, do not repaint",
        "detail": "Code sets a label; the stylesheet decides what it looks like. Appearance changes cost nothing."
      }
    },
    {
      "kind": "pattern",
      "title": "Fixed canvas, uniform scale",
      "detail": "980×612 (trays), 1180×820 (iPad), 1920×1080 (HD) — scaled, never reflowed. Layout bugs are geometry bugs, not breakpoint bugs.",
      "plain": {
        "title": "Drawn once, then scaled",
        "detail": "Fixed sizes scaled like a photo, never reflowed. Layout problems are measurement problems, not window-size problems."
      }
    },
    {
      "kind": "pattern",
      "title": "Registry over globals",
      "detail": "figures-registry.js gives the figure table one importable owner, eliminating script-order dependence.",
      "plain": {
        "title": "A coat check, not a pile",
        "detail": "Diagrams hang themselves up by name, so nothing depends on the order files happen to load in."
      }
    },
    {
      "kind": "risk",
      "title": "figkit.jsx is detached",
      "detail": "Converted to ESM but imported by nothing — it does not load at runtime. Wire it in or retire it.",
      "plain": {
        "title": "A tool nobody picks up",
        "detail": "One file of diagram parts is referenced by nothing and never loads. It looks alive, which wastes a future reader’s time. Wire it in or delete it."
      }
    },
    {
      "kind": "risk",
      "title": "CDN dependency at boot",
      "detail": "The live reader needs unpkg (Babel) and esm.sh (React) at load time. Offline or blocked, the page shows the loader's error panel.",
      "plain": {
        "title": "Needs the internet to start",
        "detail": "The live version fetches the translator and the toolkit at startup. Offline, it shows an error instead of an app. The packaged build does not have this problem."
      }
    },
    {
      "kind": "risk",
      "title": "Compile cost on every load",
      "detail": "The no-build reader re-fetches and re-compiles the whole graph per page load. Fine for a study build; the Vite output is the answer for production.",
      "plain": {
        "title": "Re-translated on every load",
        "detail": "The live version redoes the whole translation each time it opens. Fine while building; the packaged build is the answer for real use."
      }
    },
    {
      "kind": "note",
      "title": "No backend",
      "detail": "No API, no database, no auth, no persistence beyond the host-written EDITMODE block. Content ships as constants in data.js.",
      "plain": {
        "title": "Nothing is stored anywhere",
        "detail": "No server, no database, no login. All content is typed into the app itself."
      }
    }
  ],
  "$note": "Every layer, node, flow, step and observation carries a `plain` twin: plain.label/note, plain.sub/notes, plain.label/summary, plain.title/detail. Technical text is the default field; `plain` is the same meaning in non-specialist English."
}</script>
<script>
const D = JSON.parse(document.getElementById('arch-data').textContent);
const LC = {shell:'#b45309',entry:'#7c3aed',core:'#2563eb',screens:'#0891b2',ui:'#059669',data:'#e11d48',style:'#64748b'};
const N = Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const LI = Object.fromEntries(D.layers.map((l,i)=>[l.id,i]));
const cols=document.getElementById('cols'), svg=document.getElementById('wires'), canvas=document.getElementById('canvas'), fitbox=document.getElementById('fitbox'), scaler=document.getElementById('scaler'), main=document.getElementById('main'), side=document.getElementById('side');
var FIT=1,FITON=false,PANELON=true;
/* Present mode: shrink the whole diagram so it fits the visible pane in one view. FIT feeds pt() so wire math stays in logical units. */
function fit(){
  scaler.style.transform='';fitbox.style.height='';FIT=1;
  if(!FITON)return;  const nw=scaler.scrollWidth,nh=scaler.scrollHeight;
  const over=PANELON?Math.min(side.offsetWidth+30,fitbox.clientWidth*.45):0;
  const availW=fitbox.clientWidth-over;
  const availH=main.clientHeight-(main.scrollHeight-fitbox.offsetHeight)-6;
  const s=Math.min(1,availW/nw,availH/nh);
  if(!(s>0)||s>=1)return;
  FIT=s;scaler.style.transform='scale('+s+')';fitbox.style.height=Math.ceil(nh*s)+'px';
  fitbox.scrollLeft=0;fitbox.scrollTop=0;/* overflow is hidden while fitting, so a leftover offset would be unrecoverable */
}
function setFit(on){
  FITON=on;document.getElementById('btnFit').classList.toggle('on',on);
  document.body.classList.toggle('fitview',on);
  try{localStorage.setItem('am-arch-fitview',on?'1':'0')}catch(_){}
  schedule();
}
let activeFlow=null, activeStep=-1, selNode=null, _raf=0;
function schedule(){cancelAnimationFrame(_raf);_raf=requestAnimationFrame(()=>requestAnimationFrame(draw))}

var MODE='p';
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function T(o,k){return esc(MODE==='p'&&o&&o.plain&&o.plain[k]?o.plain[k]:o[k])}
const flowList=document.getElementById('flowList');

function buildCols(){
  cols.innerHTML='';
  D.layers.forEach(L=>{
    const c=document.createElement('div'); c.className='col'; c.dataset.layer=L.id;
    c.innerHTML='<div class="colhead" style="color:'+LC[L.id]+'">'+T(L,'label')+'</div>';
    const wrap=document.createElement('div'); wrap.className='colwrap flex flex-col gap-2.5';
    D.nodes.filter(n=>n.layer===L.id).forEach(n=>{
      const b=document.createElement('button'); b.className='node'; b.dataset.id=n.id;
      b.innerHTML='<span class="nbadge"></span><span class="nd" style="background:'+LC[n.layer]+'"></span><span class="nt">'+esc(n.label)+'</span><span class="ns">'+T(n,'sub')+'</span>';
      b.onclick=()=>selectNode(n.id); wrap.appendChild(b);
    });
    c.appendChild(wrap); cols.appendChild(c);
  });
  document.getElementById('legend').innerHTML=D.layers.map(L=>'<span class="flex items-center gap-1.5 text-[11px] text-slate-500"><span style="width:8px;height:8px;border-radius:2px;background:'+LC[L.id]+'"></span>'+T(L,'label')+'</span>').join('');
  document.getElementById('obs').innerHTML=D.observations.map(o=>{
    const c=o.kind==='risk'?'#c2410c':o.kind==='note'?'#64748b':'#0f766e';
    return '<div class="card p-3"><div class="text-[9.5px] font-bold uppercase tracking-wider mb-1.5" style="color:'+c+'">'+esc(o.kind)+'</div><div class="text-[12.5px] font-semibold mb-1 leading-snug">'+T(o,'title')+'</div><div class="text-[11.5px] text-slate-500 leading-relaxed">'+T(o,'detail')+'</div></div>';
  }).join('');
  document.getElementById('obsCount').textContent=D.observations.length;
  flowList.innerHTML='';
  D.flows.forEach(f=>{
    const b=document.createElement('button'); b.className='flowcard'+(activeFlow&&activeFlow.id===f.id?' on':''); b.dataset.flow=f.id;
    b.innerHTML='<div class="ft">'+T(f,'label')+'</div><div class="fs">'+T(f,'summary')+'</div>';
    b.onclick=()=>setFlow(activeFlow&&activeFlow.id===f.id?null:f); flowList.appendChild(b);
  });
}
buildCols();

function el(id){return cols.querySelector('[data-id="'+id+'"]')}
function pt(id){
  const r=el(id).getBoundingClientRect(), c=scaler.getBoundingClientRect(), S=FIT||1;
  return {l:(r.left-c.left)/S,r:(r.right-c.left)/S,cx:(r.left-c.left+r.width/2)/S,cy:(r.top-c.top+r.height/2)/S,t:(r.top-c.top)/S,b:(r.top-c.top+r.height)/S};
}
function dFor(a,b){
  const A=pt(a),B=pt(b), ia=LI[N[a].layer], ib=LI[N[b].layer];
  if(ia===ib){const x=Math.max(A.r,B.r)+10,bulge=30;return 'M'+A.r+' '+A.cy+' C'+(x+bulge)+' '+A.cy+', '+(x+bulge)+' '+B.cy+', '+B.r+' '+B.cy}
  if(ib>ia){const k=Math.max(26,(B.l-A.r)*.55);return 'M'+A.r+' '+A.cy+' C'+(A.r+k)+' '+A.cy+', '+(B.l-k)+' '+B.cy+', '+B.l+' '+B.cy}
  const k=Math.max(26,(A.l-B.r)*.55);return 'M'+A.l+' '+A.cy+' C'+(A.l-k)+' '+A.cy+', '+(B.r+k)+' '+B.cy+', '+B.r+' '+B.cy;
}
function draw(){
  fit();
  [...svg.querySelectorAll('path.wire,path.fwire')].forEach(p=>p.remove());
  D.edges.forEach(e=>{
    if(!el(e.from)||!el(e.to))return;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','wire'); p.setAttribute('d',dFor(e.from,e.to));
    p.setAttribute('marker-end','url(#ah)'); p.dataset.from=e.from; p.dataset.to=e.to; svg.appendChild(p);
  });
  if(activeFlow){
    const P=activeFlow.path;
    for(let i=0;i<P.length-1;i++){
      if(!el(P[i])||!el(P[i+1]))continue;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','fwire'); p.setAttribute('d',dFor(P[i],P[i+1])); p.setAttribute('marker-end','url(#ahf)'); svg.appendChild(p);
    }
  }
  paint();
}
function paint(){
  const inFlow=activeFlow?new Set(activeFlow.path):null;
  cols.querySelectorAll('.node').forEach(n=>{
    const id=n.dataset.id;
    n.classList.toggle('dim',!!inFlow&&!inFlow.has(id));
    n.classList.toggle('on',!!inFlow&&inFlow.has(id));
    n.classList.toggle('sel',selNode===id);
    const bg=n.querySelector('.nbadge');
    if(inFlow&&inFlow.has(id)){const i=activeFlow.path.indexOf(id)+1;bg.textContent=i;bg.dataset.n=i}
    else{bg.removeAttribute('data-n');bg.textContent=''}
  });
  svg.querySelectorAll('path.wire').forEach(p=>{
    p.classList.remove('mute','lit');
    if(activeFlow)p.classList.add('mute');
    else if(selNode&&(p.dataset.from===selNode||p.dataset.to===selNode))p.classList.add('lit');
    else if(selNode)p.classList.add('mute');
  });
}
function setFlow(f){
  activeFlow=f; activeStep=-1; selNode=null;
  flowList.querySelectorAll('.flowcard').forEach(c=>c.classList.toggle('on',!!f&&c.dataset.flow===f.id));
  flowList.classList.toggle('picked',!!f);
  document.getElementById('stepCount').textContent=f?f.steps.length+' steps':'';
  if(f)setSec('steps',true);
  renderSteps(); draw();
  if(f)requestAnimationFrame(()=>{document.getElementById('sidebody').scrollTop=0});
}
function renderSteps(){
  const box=document.getElementById('steps');
  if(!activeFlow){box.innerHTML='<p class="text-[12px] text-slate-400 leading-relaxed px-2 py-2">No flow selected. Pick one above — its path lights up across the diagram and the steps appear here.</p>';return}
  box.classList.remove('slidein'); void box.offsetWidth; box.classList.add('slidein');
  box.innerHTML=activeFlow.steps.map((s,i)=>'<div class="step'+(i===activeStep?' on':'')+'" data-i="'+i+'"><div class="sn">'+(i+1)+'</div><div><div class="mono text-[10.5px] text-slate-400 mb-1">'+esc(N[s.node].label)+'</div><div class="text-[12.5px] font-semibold leading-snug">'+T(s,'title')+'</div><div class="text-[11.5px] text-slate-500 leading-relaxed mt-1">'+T(s,'detail')+'</div></div></div>').join('');
  box.querySelectorAll('.step').forEach(d=>d.onclick=()=>{    activeStep=+d.dataset.i; const id=activeFlow.steps[activeStep].node;
    renderSteps(); selectNode(id,true);
    const n=el(id); n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
  });
}
const INSPECT_EMPTY='<p class="text-[12px] text-slate-400 leading-relaxed">Click any node in the diagram for its file, role, dependencies and dependents.</p>';
function selectNode(id,keep){
  selNode=id; if(!keep&&activeFlow===null)activeStep=-1;
  const n=N[id];
  const imp=D.edges.filter(e=>e.from===id), by=D.edges.filter(e=>e.to===id);
  const fl=D.flows.filter(f=>f.path.includes(id));
  const list=(arr,dir)=>arr.length?arr.map(e=>'<button class="text-left w-full text-[11.5px] text-slate-600 hover:text-indigo-600 py-0.5" data-go="'+(dir==='out'?e.to:e.from)+'">'+(dir==='out'?'→ ':'← ')+esc(N[dir==='out'?e.to:e.from].label)+(e.label?' <span class="text-slate-400">'+esc(e.label)+'</span>':'')+'</button>').join(''):'<div class="text-[11.5px] text-slate-400">none</div>';
  document.getElementById('inspector').innerHTML=
    '<div class="rowhead mb-2">Node</div>'+
    '<div class="flex items-center gap-2 mb-1"><span style="width:8px;height:8px;border-radius:50%;background:'+LC[n.layer]+'"></span><span class="mono text-[13px] font-bold">'+esc(n.label)+'</span></div>'+
    '<div class="mono text-[10px] text-slate-400 break-all mb-3">'+esc(n.file)+'</div>'+
    '<div class="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">'+esc(n.role)+'</div>'+
    '<p class="text-[11.5px] text-slate-600 leading-relaxed mb-3">'+T(n,'notes')+'</p>'+
    '<div class="grid grid-cols-2 gap-3"><div><div class="rowhead mb-1.5">Depends on</div><div class="flex flex-col">'+list(imp,'out')+'</div></div>'+
    '<div><div class="rowhead mb-1.5">Used by</div><div class="flex flex-col">'+list(by,'in')+'</div></div></div>'+
    (fl.length?'<div class="rowhead mb-1.5 mt-3">Appears in</div><div class="flex flex-wrap gap-1.5">'+fl.map(f=>'<button class="chip !px-2.5 !py-1 !text-[10.5px]" data-flow-go="'+f.id+'">'+T(f,'label')+'</button>').join('')+'</div>':'');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>selectNode(b.dataset.go));
  document.querySelectorAll('[data-flow-go]').forEach(b=>b.onclick=()=>setFlow(D.flows.find(f=>f.id===b.dataset.flowGo)));
  paint();
}
document.getElementById('inspector').innerHTML='<div class="rowhead mb-2">Node</div>'+INSPECT_EMPTY;
document.getElementById('btnReset').onclick=()=>{selNode=null;setFlow(null);document.getElementById('inspector').innerHTML='<div class="rowhead mb-2">Node</div>'+INSPECT_EMPTY};
document.getElementById('btnCopy').onclick=async e=>{try{await navigator.clipboard.writeText(JSON.stringify(D,null,2));e.target.textContent='Copied';setTimeout(()=>e.target.textContent='Copy JSON',1400)}catch(_){e.target.textContent='Copy failed';setTimeout(()=>e.target.textContent='Copy JSON',1400)}};
document.getElementById('btnDl').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='alphabetmath-architecture.json';a.click();URL.revokeObjectURL(a.href)};
new ResizeObserver(()=>schedule()).observe(fitbox);
window.addEventListener('resize',()=>schedule());
function setMode(m){
  MODE=m;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  try{localStorage.setItem('am-arch-mode',m)}catch(_){}
  buildCols();
  document.getElementById('stepCount').textContent=activeFlow?activeFlow.steps.length+' steps':'';
  renderSteps();
  if(selNode)selectNode(selNode,true); else paint();
  schedule();
}
const SECS={flows:'flowList',steps:'steps',node:'inspector',obs:'obs'};
function setSec(k,open){
  const head=document.querySelector('.sechead[data-sec="'+k+'"]');
  document.getElementById(SECS[k]).style.display=open?'':'none';
  head.classList.toggle('open',open);
  try{localStorage.setItem('am-arch-sec-'+k,open?'1':'0')}catch(_){}
}
Object.keys(SECS).forEach(k=>{
  let open=k!=='obs'; try{const v=localStorage.getItem('am-arch-sec-'+k); if(v!==null)open=v==='1'}catch(_){}
  const head=document.querySelector('.sechead[data-sec="'+k+'"]');
  head.onclick=e=>{if(e.target.closest('#btnReset'))return;open=!open;setSec(k,open);schedule()};
  setSec(k,open);
});
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('btnFit').onclick=()=>setFit(!FITON);
function setPanel(on){
  PANELON=on;document.body.classList.toggle('panel-off',!on);
  document.getElementById('btnPanel').classList.toggle('on',on);
  try{localStorage.setItem('am-arch-panel',on?'1':'0')}catch(_){}
  schedule();
}
document.getElementById('btnPanel').onclick=()=>setPanel(!PANELON);
document.getElementById('btnClose').onclick=()=>setPanel(false);
function placePanel(){document.body.style.setProperty('--paneTop',Math.round(document.querySelector('header').getBoundingClientRect().bottom+12)+'px')}
new ResizeObserver(placePanel).observe(document.querySelector('header'));
